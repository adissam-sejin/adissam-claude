<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OOTD 다이어리</title>
  <meta name="description" content="내 옷장을 기록하고, 오늘 날씨에 맞는 코디를 추천받는 OOTD 다이어리">
  <meta name="theme-color" content="#F4F1EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OOTD">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <main id="view" class="view" aria-live="polite"></main>
    <nav class="tabbar" id="tabbar" aria-label="주요 메뉴"></nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <input type="file" id="file-photo" accept="image/*" hidden>
  <input type="file" id="file-data" accept=".json,.csv,.txt,application/json,text/csv,text/plain" hidden>
  <script type="module" src="js/app.js"></script>
