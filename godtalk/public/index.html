<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#243161" id="themeColor" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<meta name="description" content="하나님과 나눈 이야기를 날마다 적어 두는 조용한 기록장" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="하나님과의 대화" />
<title>하나님과의 대화</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
<script>
/* 화면이 뜨기 전에 밝은/어두운 화면을 먼저 정합니다 */
(function(){
  var t = 'auto'; try{ t = JSON.parse(localStorage.getItem('gt_theme')) || 'auto'; }catch(e){}
  var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
<style>
  /* ── 색 ── 어두운 화면「새벽 하늘」 */
  :root{
    --page:#0A0E24;
    --bg:radial-gradient(1px 1px at 14% 9%,rgba(255,255,255,.75),transparent 60%),
         radial-gradient(1px 1px at 82% 6%,rgba(255,255,255,.6),transparent 60%),
         radial-gradient(1.5px 1.5px at 64% 15%,rgba(207,224,255,.7),transparent 60%),
         radial-gradient(1px 1px at 33% 21%,rgba(255,255,255,.45),transparent 60%),
         radial-gradient(1px 1px at 91% 27%,rgba(255,255,255,.4),transparent 60%),
         radial-gradient(120% 60% at 50% -10%,rgba(224,185,106,.10),transparent 60%),
         linear-gradient(180deg,#243161 0%,#141B3D 45%,#0A0E24 100%);
    --text:#EEF2FB; --soft:#CFE0FF; --sub:#8E9CCB; --faint:#4A5A94;
    --accent:#E0B96A; --accentSoft:#A88F55; --accentBg:rgba(224,185,106,.15); --accentLine:rgba(224,185,106,.45);
    --bad:#F0A3AC; --good:#7BD88F; --heart:#F0A3AC;
    --line:rgba(255,255,255,.09); --card:rgba(255,255,255,.055); --sheet:#161E45;
    --godB:#EEF2FB; --godInk:#161B33; --godLine:transparent; --godShadow:0 4px 22px rgba(207,224,255,.14); --refInk:#8A6D2B;
    --mineB:#E0B96A; --mineInk:#1B1A12;
    --bar:rgba(6,9,24,.55); --field:rgba(255,255,255,.08); --fieldLine:rgba(255,255,255,.12);
    --seg:rgba(255,255,255,.08); --segOn:#EEF2FB; --segOnInk:#161B33;
    --cta:#EEF2FB; --ctaInk:#161B33; --send:#E0B96A; --sendInk:#161B33;
    --chip:rgba(255,255,255,.10); --chipInk:#CFE0FF; --pick:#1E2857; --rx:rgba(255,255,255,.10);
    --veil:rgba(6,9,24,.72); --toast:#EEF2FB; --toastInk:#161B33; --dnum:#6B7BB5; --sun:#B98A9A;
    --serif:'Gowun Batang','Nanum Myeongjo',AppleMyungjo,'Apple Myungjo','Batang',serif;
    --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,sans-serif;
    --emoji:'Apple Color Emoji','Noto Color Emoji','Segoe UI Emoji',sans-serif;
    --fs:1;
  }
  /* ── 밝은 화면「따뜻한 편지지」 */
  :root[data-theme=light]{
    --page:#EDE4D3;
    --bg:linear-gradient(180deg,#F7F0E3 0%,#F3EBDD 60%,#EFE5D3 100%);
    --text:#3A2E22; --soft:#5A4936; --sub:#8F7D68; --faint:#C2B49E;
    --accent:#9A6B2F; --accentSoft:#A58A62; --accentBg:rgba(154,107,47,.12); --accentLine:rgba(154,107,47,.45);
    --bad:#C2524F; --good:#5E9A62; --heart:#E08A8F;
    --line:rgba(58,46,34,.12); --card:#FFFDF8; --sheet:#FFFDF8;
    --godB:#FFFDF8; --godInk:#3A2E22; --godLine:rgba(154,107,47,.38); --godShadow:none; --refInk:#9A6B2F;
    --mineB:#CBD9C2; --mineInk:#26301F;
    --bar:#FBF6EC; --field:#FFFDF8; --fieldLine:rgba(58,46,34,.14);
    --seg:#EADFCB; --segOn:#3A2E22; --segOnInk:#FBF6EC;
    --cta:#3A2E22; --ctaInk:#FBF6EC; --send:#9A6B2F; --sendInk:#FFFDF8;
    --chip:rgba(58,46,34,.09); --chipInk:#6B5A47; --pick:#FFFDF8; --rx:#FFFDF8;
    --veil:rgba(40,30,20,.45); --toast:#3A2E22; --toastInk:#FBF6EC; --dnum:#B3A38C; --sun:#C2524F;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--page);color:var(--text);font-family:var(--sans);overscroll-behavior:none;-webkit-text-size-adjust:100%}
  button{font-family:inherit;font-size:inherit;border:none;background:none;color:inherit;cursor:pointer}
  input,textarea{font-family:inherit;border:none;outline:none}
  a{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  #app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
  @media (min-width:560px){ #app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
  .scr{flex:1;display:flex;flex-direction:column;min-height:0;animation:fade .3s ease;background:var(--bg);padding-top:env(safe-area-inset-top)}
  .row{display:flex;align-items:center}
  .grow{flex:1;min-width:0}
  .eyebrow{font-size:10px;letter-spacing:2px;font-weight:700;color:var(--accentSoft)}
  .serif{font-family:var(--serif)}
  .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .scroll::-webkit-scrollbar{width:5px}
  .scroll::-webkit-scrollbar-thumb{background:var(--faint);border-radius:99px}
  .ib{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border-radius:99px;color:var(--sub);flex:none}
  .ib:active{background:var(--line)}
  .ib.strong{color:var(--text)}
  .link{color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13px;padding:6px 0}
  .dim{color:var(--sub)}
  em.e{font-style:normal;font-family:var(--emoji)}

  /* 들어가기 */
  .gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 30px;text-align:center}
  .face{border-radius:32%;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.25);background:var(--card)}
  .kakao{width:100%;max-width:320px;height:52px;border-radius:12px;background:#FEE500;color:rgba(0,0,0,.85);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .kakao[aria-disabled=true]{opacity:.45;pointer-events:none}
  .note{font-size:12px;color:var(--sub);line-height:1.8;word-break:keep-all}

  /* 달력 */
  .head{padding:16px 12px 4px 20px}
  .month{font-family:var(--serif);font-size:30px;letter-spacing:1px;text-align:center}
  .wk{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px;margin-top:18px}
  .wk div{text-align:center;font-size:11px;color:var(--sub);letter-spacing:1px}
  .wk div:first-child{color:var(--sun)}
  .days{display:grid;grid-template-columns:repeat(7,1fr);padding:6px 12px;gap:2px 0;align-content:start}
  .day{height:58px;padding-top:7px;border-radius:14px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center}
  .day:active{background:var(--line)}
  .day.today{background:var(--accentBg);border-color:var(--accentLine)}
  .dnum{font-size:14px;color:var(--dnum)}
  .day.has .dnum{color:var(--text);font-weight:600}
  .day.today .dnum{color:var(--accent)}
  .hslot{height:24px;display:flex;align-items:center;color:var(--heart)}
  .hslot svg{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
  .cta{width:100%;background:var(--cta);color:var(--ctaInk);padding:16px;border-radius:18px;font-weight:700;font-size:15px}
  .cta:active{transform:scale(.985)}
  .cta.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
  .cta.small{padding:12px;font-size:14px;border-radius:14px}
  .cta:disabled{opacity:.45}

  /* 대화 */
  .bar{padding:8px 8px;border-bottom:1px solid var(--line);min-height:58px}
  #list{flex:1;padding:12px 12px 16px}
  .daychip{display:table;margin:0 auto 12px;font-size:11px;padding:5px 13px;border-radius:99px;background:var(--chip);color:var(--chipInk)}
  .m{display:flex;gap:8px;margin-top:4px}
  .m.first{margin-top:12px}
  .m.me{justify-content:flex-end}
  .m.new{animation:up .28s cubic-bezier(.22,.9,.3,1)}
  .av{width:38px;height:38px;border-radius:15px;flex:none;object-fit:cover;background:var(--card)}
  .av.sp{background:none}
  .mc{display:flex;flex-direction:column;align-items:flex-start;min-width:0;max-width:calc(100% - 46px)}
  .m.me .mc{align-items:flex-end;max-width:100%}
  .nm{font-size:12px;color:var(--sub);margin:0 0 4px 2px}
  .line{display:flex;align-items:flex-end;gap:6px;max-width:100%}
  .m.me .line{flex-direction:row-reverse}
  .b{padding:9px 13px;line-height:1.65;text-align:left;word-break:keep-all;overflow-wrap:anywhere;min-width:0;max-width:min(74vw,390px)}
  .b.god{background:var(--godB);color:var(--godInk);border-radius:4px 18px 18px 18px;font-family:var(--serif);font-size:calc(15.5px*var(--fs));border:1px solid var(--godLine);box-shadow:var(--godShadow)}
  .b.me{background:var(--mineB);color:var(--mineInk);border-radius:18px 4px 18px 18px;font-size:calc(14.5px*var(--fs))}
  .b.wait{opacity:.6}
  .b.flash{animation:flash 1.6s ease}
  .ref{display:block;margin-top:7px;font-size:calc(11.5px*var(--fs));color:var(--refInk);font-family:var(--sans)}
  .tm{font-size:10px;color:var(--sub);white-space:nowrap;padding-bottom:3px;flex:none}
  .rx{display:inline-flex;align-items:center;margin-top:4px;padding:2px 8px;border-radius:99px;background:var(--rx);border:1px solid var(--line);font-size:14px;font-family:var(--emoji);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
  .picker{display:inline-flex;align-items:center;gap:2px;margin-top:6px;padding:5px 8px;border-radius:99px;background:var(--pick);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.22);animation:up .2s;max-width:100%}
  .picker .em{width:40px;height:40px;border-radius:99px;font-size:23px;font-family:var(--emoji);display:flex;align-items:center;justify-content:center;transition:transform .12s}
  .picker .em:active{transform:scale(1.25)}
  .picker .em.on{background:var(--accentBg);box-shadow:inset 0 0 0 1.5px var(--accentLine)}
  .picker s{width:1px;height:20px;background:var(--line);margin:0 4px}
  .picker .more{font-size:12px;color:var(--sub);padding:8px 8px;white-space:nowrap}
  .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;animation:up .2s}
  .m.me .acts{justify-content:flex-end}
  .act{font-size:12px;padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--soft)}
  .act.on{color:var(--accent);border-color:var(--accentLine)}
  .act.warn{color:var(--bad)}
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px}
  .banner{font-size:12px;color:var(--accent);background:var(--accentBg);padding:8px 14px;text-align:center}
  .inp{padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:var(--bar);border-top:1px solid var(--line)}
  .who{display:inline-flex;padding:3px;border-radius:99px;background:var(--seg)}
  .who button{font-size:12.5px;font-weight:700;padding:6px 15px;border-radius:99px;color:var(--sub)}
  .who button.on{background:var(--segOn);color:var(--segOnInk);box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .reftag{font-size:11px;color:var(--accent);background:var(--accentBg);padding:4px 4px 4px 10px;border-radius:99px;display:none;align-items:center;gap:2px}
  .plus{width:40px;height:40px;border-radius:99px;background:var(--seg);display:flex;align-items:center;justify-content:center;color:var(--text);flex:none}
  .ta{flex:1;resize:none;max-height:130px;line-height:1.5;border-radius:20px;padding:9px 14px;font-size:max(16px,calc(15px*var(--fs)));background:var(--field);color:var(--text);border:1px solid var(--fieldLine);min-width:0}
  .ta::placeholder{color:var(--sub)}
  .ta.god{font-family:var(--serif)}
  .send{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--send);color:var(--sendInk)}
  .send:disabled{opacity:.38}

  /* 시트·창 */
  .veil{position:absolute;inset:0;background:var(--veil);z-index:60;display:flex;flex-direction:column;animation:fade .2s}
  .sheetbox{background:var(--sheet);height:88%;border-radius:0 0 24px 24px;border-bottom:1px solid var(--accentLine);display:flex;flex-direction:column;animation:down .28s cubic-bezier(.22,.9,.3,1);padding-top:env(safe-area-inset-top)}
  .bsheet{margin-top:auto;background:var(--sheet);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.22,.9,.3,1)}
  .grab{width:38px;height:4px;border-radius:9px;background:var(--faint);margin:0 auto 14px;opacity:.6}
  .dialog{margin:auto 20px;background:var(--sheet);border:1px solid var(--accentLine);border-radius:22px;padding:22px 20px 18px;animation:up .25s cubic-bezier(.22,.9,.3,1);max-height:86%;display:flex;flex-direction:column}
  .dialog h3,.bsheet h3{font-family:var(--serif);font-size:18px;font-weight:700}
  .dialog p,.bsheet p{font-size:13px;color:var(--sub);line-height:1.8;margin-top:8px;word-break:keep-all}
  .dialog .btns{display:flex;gap:8px;margin-top:18px}
  .field{width:100%;background:var(--field);border:1px solid var(--fieldLine);border-radius:14px;padding:13px 14px;color:var(--text);font-size:16px;margin-top:10px}
  .field::placeholder{color:var(--faint)}
  textarea.field{resize:none;line-height:1.6;min-height:130px}
  .sbar{margin:0 16px 12px;background:var(--field);border:1px solid var(--fieldLine);border-radius:14px;padding:4px 6px 4px 14px;display:flex;align-items:center;gap:8px;color:var(--sub)}
  .sbar input{flex:1;background:none;color:var(--text);font-size:16px;padding:10px 0;min-width:0}
  .sbar input::placeholder{color:var(--faint)}
  .tabs{display:flex;gap:6px;padding:0 16px 12px}
  .tab{flex:1;padding:9px;border-radius:12px;font-size:13px;color:var(--sub);background:var(--card);border:1px solid var(--line)}
  .tab.on{background:var(--accentBg);color:var(--accent);font-weight:700;border-color:transparent}
  .vs{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:8px;display:block}
  .vs:active{border-color:var(--accentLine)}
  .vs .r{font-size:11px;color:var(--accent);margin-bottom:5px}
  .vs .t{font-family:var(--serif);font-size:calc(14.5px*var(--fs));line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
  .vs .p{font-size:11px;color:var(--accentSoft);margin-top:8px}
  mark{background:var(--accentBg);color:inherit;padding:0 1px;border-radius:2px;box-shadow:inset 0 -2px 0 var(--accentLine)}
  .chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:6px}
  .chip{padding:10px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--soft)}
  .chip:active,.chip.on{border-color:var(--accent);color:var(--accent)}
  .verse{display:flex;gap:10px;width:100%;text-align:left;padding:9px 6px;border-radius:10px;font-family:var(--serif);font-size:calc(15px*var(--fs));line-height:1.8;word-break:keep-all;overflow-wrap:anywhere}
  .verse:active{background:var(--accentBg)}
  .verse b{font-family:var(--sans);font-size:11px;color:var(--accent);padding-top:5px;min-width:20px;text-align:right;font-weight:600}
  .lbl{font-size:11px;letter-spacing:2px;color:var(--accentSoft);font-weight:700;margin:14px 0 8px}

  /* 찾기·모아보기 */
  .pills{display:flex;gap:6px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--text);white-space:nowrap;flex:none}
  .pill.on{background:var(--segOn);color:var(--segOnInk);border-color:transparent;font-weight:700}
  .hit{width:100%;text-align:left;display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:8px}
  .hit:active{border-color:var(--accentLine)}
  .hit .d{font-size:11px;color:var(--sub);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .hit .d em{font-size:15px}
  .hit .t{font-size:calc(14px*var(--fs));line-height:1.75;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
  .hit.god .t{font-family:var(--serif);font-size:calc(15px*var(--fs))}
  .hit .r{font-size:11px;color:var(--accent);margin-top:6px}

  /* 설정 */
  .sec{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:700}
  .desc{font-size:calc(13px*var(--fs));color:var(--sub);margin-top:8px;line-height:1.8;word-break:keep-all}
  .desc b{color:var(--text);font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:14px;font-size:calc(13px*var(--fs));line-height:1.8;word-break:keep-all}
  .rule{height:1px;background:var(--line);margin:28px 0}
  .dot{width:7px;height:7px;border-radius:99px;flex:none}
  .seg{display:flex;gap:6px;margin-top:14px}
  .seg button{flex:1;padding:11px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--sub);font-size:13px;white-space:nowrap}
  .seg button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
  .steps{counter-reset:s;margin-top:10px}
  .steps li{list-style:none;counter-increment:s;position:relative;padding-left:26px;font-size:13px;color:var(--sub);line-height:1.8;margin-bottom:8px;word-break:keep-all}
  .steps li:before{content:counter(s);position:absolute;left:0;top:3px;width:18px;height:18px;border-radius:99px;background:var(--accentBg);color:var(--accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .steps b{color:var(--text);font-weight:600}
  .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .stat3 div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center}
  .stat3 b{display:block;font-family:var(--serif);font-size:24px;color:var(--text)}
  .stat3 span{font-size:11px;color:var(--sub)}
  .bar2{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
  .bar2 i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .dates{display:flex;align-items:center;gap:8px;margin-top:12px}
  .dt{flex:1;border:1px solid var(--fieldLine);background:var(--field);border-radius:14px;padding:8px 12px;min-width:0}
  .dt small{display:block;font-size:10.5px;color:var(--sub)}
  .dt input{width:100%;background:none;color:var(--text);font-size:16px;font-weight:600;padding:2px 0;color-scheme:dark}
  :root[data-theme=light] .dt input{color-scheme:light}

  /* 잠금 */
  .dots{display:flex;gap:12px;margin:26px 0 6px;height:14px}
  .dots i{width:11px;height:11px;border-radius:99px;border:1px solid var(--sub);display:block}

const nl = (s) => esc(s).replace(/\n/g,'<br/>');
const pad = (n) => String(n).padStart(2,'0');
const keyOf = (d) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toDate = (k) => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const shift = (k, n) => { const d = toDate(k); d.setDate(d.getDate()+n); return keyOf(d); };

async function api(payload, quiet){

  try{
    const r = await fetch('/api', { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin', body:JSON.stringify(payload) });

function forward(restore){ trail.push(restore); try{ history.pushState({ n:trail.length }, ''); }catch(e){} }

/* 작은 창 */
function veil(inner){
  const v = el('<div class="veil"></div>');
  v.appendChild(typeof inner === 'string' ? el(inner) : inner);
  v.addEventListener('click', (e) => { if(e.target === v) v.remove(); });
  app.appendChild(v);
  return v;
}
function whenGone(v, fn){ new MutationObserver((_, o) => { if(!v.isConnected){ o.disconnect(); fn(); } }).observe(app, { childList:true }); }
function ask({ title, body, ok, cancel, danger }){
  return new Promise((done) => {
    const v = veil('<div class="dialog" role="dialog" aria-modal="true"><h3>'+esc(title)+'</h3>'+(body?'<p>'+body+'</p>':'')+
      '<div class="btns"><button class="cta ghost small" data-a="no">'+esc(cancel||'아니요')+'</button>'+
      '<button class="cta small" data-a="yes"'+(danger?' style="background:var(--bad);color:#fff"':'')+'>'+esc(ok||'네')+'</button></div></div>');
    let answered = false;
    const finish = (val) => { if(answered) return; answered = true; v.remove(); done(val); };
    $('[data-a=yes]', v).onclick = () => finish(true);
    $('[data-a=no]', v).onclick = () => finish(false);
    whenGone(v, () => finish(false));
  });
}

/* ── 보내지 못한 글 보관함 (인터넷이 끊겼을 때) ── */
const outbox = {
  all(){ return store.get('gt_outbox', []); },
  mine(){ const t = S.me ? S.me.tag : store.get('gt_tag', ''); return this.all().filter(o => o.tag === t); },
  put(o){ const a = this.all(); a.push(o); store.set('gt_outbox', a); },
  drop(tmp){ store.set('gt_outbox', this.all().filter(o => o.tmp !== tmp)); },
  mark(tmp, err){ store.set('gt_outbox', this.all().map(o => o.tmp === tmp ? Object.assign(o, { err }) : o)); }
};
let chain = Promise.resolve();
function deliver(o){
  chain = chain.then(async () => {
    if(!outbox.all().some(x => x.tmp === o.tmp)) return;
    const pageId = S.dayKey === o.date ? S.pageId : null;
    const res = await api({ action:'add', date:o.date, pageId, who:o.who, text:o.text, ref:o.ref, time:o.time }, true);
    if(res.error === 'offline'){ outbox.mark(o.tmp, ''); refreshPending(); return; }
    if(res.error === 'auth' || res.error === 'locked'){ outbox.mark(o.tmp, ''); return; }
    if(res.error){ outbox.mark(o.tmp, res.message || '저장하지 못했어요'); refreshPending(); return; }
    outbox.drop(o.tmp);
    if(S.dates && !S.dates.includes(o.date)){ S.dates.push(o.date); S.dates.sort(); }
    if(S.dayKey === o.date && S.screen === 'chat'){
      if(res.pageId) S.pageId = res.pageId;
      S.msgs.push({ id:res.id, who:o.who, text:o.text, ref:o.ref, time:o.time });
      drawList(false);
    }
  });
  return chain;
}
function flushOutbox(){ if(S.me && !S.me.locked) outbox.mine().filter(o => !o.err).forEach(deliver); }
function refreshPending(){ if(S.screen === 'chat') drawList(false); }
window.addEventListener('online', () => {
  if(!S.me){ boot(); return; }
  S.offline = false;
  if(S.screen === 'chat') loadDay(); else flushOutbox();
});

/* ── 성경 ── */
let BIBLE = null, BOOKS = null, ABBR = {}, FULL = {}, bibleLoading = null;
const RE_STRICT = /^\s*([0-9]{0,3}\s*[가-힣A-Za-z]{1,12})\s*(\d{1,3})\s*[:장.]\s*(\d{1,3})\s*절?\s*[:.]?\s*(.+)$/;
const RE_LOOSE  = /^\s*(.{1,14}?)\s*(\d{1,3})[:\s]+(\d{1,3})\s+(.+)$/;
const RE_REF    = /^\s*([가-힣]{1,6})\s*(\d{1,3})\s*[:장\s]\s*(\d{1,3})\s*(?:[-~]\s*(\d{1,3}))?\s*절?\s*$/;

function flatten(json){
  BOOKS = json.books || {};
  const ab = json.abbrevs || {};
  ABBR = {}; FULL = {};
  for(const sh in ab){ ABBR[ab[sh]] = sh; FULL[sh] = ab[sh]; }
  const out = [];
  for(const book in BOOKS){
    const sh = ABBR[book] || book;
    for(const ch in BOOKS[book]){
      for(const vs in BOOKS[book][ch]){
        out.push({ r: sh+' '+ch+':'+vs, t: BOOKS[book][ch][vs] });
      }
    }
  }
  return out;
}
function parseFlat(raw){
  const out = [];
  for(const line of raw.split(/\r?\n/)){
    const s = line.trim(); if(!s) continue;
    if(s.indexOf('\t') > -1){
      const p = s.split('\t').map(x=>x.trim()).filter(Boolean);
      if(p.length>=4){ out.push({r:p[0]+' '+p[1]+':'+p[2], t:p.slice(3).join(' ')}); continue; }
      if(p.length===2){ out.push({r:p[0], t:p[1]}); continue; }
    }
    const m = s.match(RE_STRICT) || s.match(RE_LOOSE);
    if(m) out.push({ r:m[1].replace(/\s+/g,'')+' '+m[2]+':'+m[3], t:m[4].trim() });
    else out.push({ r:'', t:s });
  }
  return out;
}
function loadBible(){
  if(BIBLE) return Promise.resolve(BIBLE);
  if(bibleLoading) return bibleLoading;
  bibleLoading = (async () => {
    let out = [];
    try{
      let res = await fetch('/bible.json');
      if(res.ok){
        const j = await res.json();
        if(j && j.books) out = flatten(j);
        else if(Array.isArray(j)) out = j.map(v=>({ r:v.r||((v.book||'')+' '+(v.chapter||'')+':'+(v.verse||'')).trim(), t:v.t||v.text||'' }));
      }else{
        res = await fetch('/bible.txt');
        out = res.ok ? parseFlat(await res.text()) : [];
      }
    }catch(e){ out = []; }
    bibleLoading = null;
    if(out.length) BIBLE = out;
    return out;
  })();
  return bibleLoading;
}
function findBook(name){
  if(FULL[name]) return FULL[name];
  if(BOOKS && BOOKS[name]) return name;
  if(!BOOKS) return null;
  const hit = Object.keys(BOOKS).filter(b => b.indexOf(name) === 0);
  return hit.length === 1 ? hit[0] : null;
}
function byRef(term){
  if(!BOOKS) return null;
  const m = term.match(RE_REF);
  if(!m) return null;
  const book = findBook(m[1]);
  if(!book || !BOOKS[book] || !BOOKS[book][m[2]]) return null;
  const ch = BOOKS[book][m[2]], sh = ABBR[book] || book;
  const from = +m[3], to = m[4] ? +m[4] : null;
  if(!ch[from]) return null;
  if(to && to > from){
    const parts = [];
    for(let i=from; i<=to; i++) if(ch[i]) parts.push(ch[i]);
    return [{ r: sh+' '+m[2]+':'+from+'-'+to, t: parts.join(' ') }];
  }
  const out = [];
  for(let i=from; i<from+5; i++) if(ch[i]) out.push({ r: sh+' '+m[2]+':'+i, t: ch[i] });
  return out;
}

/* ══ 잠금 ══ */
function padHTML(){
  return '<div class="dots"></div><div class="padmsg"></div><div class="pad">'+
    [1,2,3,4,5,6,7,8,9].map(n=>'<button data-n="'+n+'">'+n+'</button>').join('')+
    '<button class="plain" data-a="clear">지우기</button><button data-n="0">0</button><button class="plain" data-a="ok">확인</button></div>';
}
/* onOk(pin)이 글자를 돌려주면 그 글자를 빨갛게 보여주고 다시 받습니다 */
function bindPad(root, onOk){
  let buf = '', busy = false;
  const draw = () => { $('.dots', root).innerHTML = buf.split('').map(()=>'<i class="on"></i>').join('') + (buf.length<8?'<i></i>':''); };
  draw();
  $('.pad', root).onclick = async (e) => {
    const b = e.target.closest('button'); if(!b || busy) return;
    const msg = $('.padmsg', root);
    if(b.dataset.a === 'clear'){ buf=''; draw(); return; }
    if(b.dataset.a === 'ok'){
      if(buf.length < 4){ msg.textContent='네 자리 이상이에요'; return; }
      busy = true; msg.textContent='';
      const err = await onOk(buf);
      busy = false;
      if(err && root.isConnected){ buf=''; draw(); msg.textContent = err; }
      return;
    }
    if(buf.length < 8){ buf += b.dataset.n; draw(); msg.textContent=''; }
  };
}
function showLock(){
  if(S.screen === 'lock') return;
  trail.length = 0;
  if(S.me) S.me.locked = true;
  const scr = mount('lock');
  scr.innerHTML =
    '<div class="gate">'+
      '<div class="eyebrow">DAWN LETTERS</div>'+
      '<div class="serif" style="font-size:24px;margin-top:10px">하나님과의 대화</div>'+

function streaks(dates){
  const set = new Set(dates);
  const today = keyOf(new Date());
  let k = set.has(today) ? today : shift(today, -1), now = 0;
  while(set.has(k)){ now++; k = shift(k, -1); }
  let best = 0, run = 0, prev = null;
  for(const d of dates.slice().sort()){
    run = prev && shift(prev, 1) === d ? run + 1 : 1;
    if(run > best) best = run;
    prev = d;
  }
  return { now, best, total:set.size };
}

  if(S.dates && !force) return S.dates;
  const res = await api({ action:'dates' });
  if(res.dates) S.dates = res.dates;

}

function drawDays(days){
  const y = S.cursor.getFullYear(), m = S.cursor.getMonth();
  const first = new Date(y,m,1).getDay(), last = new Date(y,m+1,0).getDate();
  const todayK = keyOf(new Date());
  let h = '';
  for(let i=0;i<first;i++) h += '<div style="height:58px"></div>';
  for(let d=1; d<=last; d++){
    const k = y+'-'+pad(m+1)+'-'+pad(d);
    const c = days[k] ? 1 : 0;
    h += '<button class="day'+(c?' has':'')+(k===todayK?' today':'')+'" data-k="'+k+'" aria-label="'+(m+1)+'월 '+d+'일'+(c?' 기록 있음':'')+'">'+
         '<span class="dnum">'+d+'</span>'+
         '<span class="hslot">'+(c?ICON.heart(16):'')+'</span></button>';
  }
  const box = $('#days');
  if(!box) return;
  box.innerHTML = h;
  $$('.day', box).forEach(b => b.onclick = () => { forward(showCalendar); showChat(b.dataset.k); });
}

async function react(m, e){
  const before = m.rx || '';

  if(next) m.rx = next; else delete m.rx;
  S.openId = null; drawList(false);
  const res = await api({ action:'react', date:S.dayKey, id:m.id, rx:next });
  if(res.error){
    if(before) m.rx = before; else delete m.rx;
    drawList(false);
    if(res.error !== 'auth' && res.error !== 'locked') say(res.message || '남기지 못했어요');
  }
}

  const who = S.who;

              date:S.dayKey, who, text, ref: who==='god' ? S.godRef : '', time: nowTime(), err:'' };

  if(!S.msgs.length){ const ym = S.dayKey.slice(0,7); if(S.days[ym]) delete S.days[ym][S.dayKey]; S.dates = null; }

function useVerse(v){

function searchBible(term){
  const box = $('#results'); if(!box) return;
  const q = term.trim();
  if(!q || !BIBLE){ box.innerHTML=''; return; }
  let found = byRef(q), mode = 'ref';
  if(!found){
    mode = 'word'; found = [];
    for(const v of BIBLE){
      if(v.t.indexOf(q) > -1 || v.r.indexOf(q) > -1){ found.push(v); if(found.length>=80) break; }
    }
  }
  if(!found.length){
    box.innerHTML = '<div style="text-align:center;color:var(--sub);font-size:13px;margin-top:36px;line-height:1.8">찾지 못했어요.<br/>낱말로 찾거나 「요 3:16」처럼 적어 보세요.</div>';
    return;
  }
  const mark = (s) => mode==='word' ? esc(s).split(esc(q)).join('<mark>'+esc(q)+'</mark>') : esc(s);
  box.innerHTML =
    (mode==='ref' ? '<div style="font-size:11px;color:var(--accentSoft);margin-bottom:10px">주소로 찾았어요 · 이어지는 구절도 고를 수 있어요</div>' : '') +
    found.map((v,i) =>
      '<button class="vs" data-i="'+i+'">'+(v.r?'<div class="r">'+esc(v.r)+'</div>':'')+
      '<div class="t">'+mark(v.t)+'</div><div class="p">이 말씀으로 쓰기</div></button>'
    ).join('') + (found.length>=80 ? '<div class="note" style="text-align:center;padding:8px">더 많아요. 낱말을 더 길게 적어 보세요.</div>' : '');
  $$('.vs', box).forEach(bt => bt.onclick = () => useVerse(found[+bt.dataset.i]));
}
function drawRead(){
  const pane = $('#paneRead'); if(!pane || !BOOKS) return;
  const names = Object.keys(BOOKS);
  const pos = store.get('gt_read', null);
  const view = (book, ch) => {
    if(!book){
      const chip = (n) => '<button class="chip" data-b="'+esc(n)+'">'+esc(ABBR[n] || n)+'</button>';
      pane.innerHTML =
        (pos && BOOKS[pos.b] ? '<button class="vs" id="resume"><div class="r">읽던 곳</div><div class="t">'+esc(pos.b)+' '+(+pos.c)+'장</div></button>' : '')+
        '<div class="lbl" style="margin-top:4px">구약</div><div class="chips">'+names.slice(0,OT).map(chip).join('')+'</div>'+
        '<div class="lbl">신약</div><div class="chips">'+names.slice(OT).map(chip).join('')+'</div>';
      if($('#resume')) $('#resume').onclick = () => view(pos.b, pos.c);
      $$('.chip', pane).forEach(c => c.onclick = () => {
        const n = Object.keys(BOOKS[c.dataset.b]).length;
        if(n === 1) view(c.dataset.b, 1); else view(c.dataset.b, null);
      });
      pane.scrollTop = 0;
      return;
    }
    const chapters = Object.keys(BOOKS[book]).map(Number).sort((a,b)=>a-b);
    const crumb = '<div class="row" style="gap:6px;margin-bottom:10px"><button class="link" data-up="1">전체</button>'+
      '<span class="dim">›</span>'+(ch ? '<button class="link" data-up="2">'+esc(book)+'</button><span class="dim">›</span><span style="font-size:13px">'+ch+'장</span>'
        : '<span style="font-size:13px">'+esc(book)+'</span>')+'</div>';
    if(!ch){
      pane.innerHTML = crumb + '<div class="chips">'+chapters.map(c => '<button class="chip" data-c="'+c+'">'+c+'</button>').join('')+'</div>';
      $$('.chip', pane).forEach(c => c.onclick = () => view(book, +c.dataset.c));
    }else{
      const vs = BOOKS[book][ch], sh = ABBR[book] || book;
      const i = chapters.indexOf(ch);
      pane.innerHTML = crumb +
        '<div class="note" style="margin-bottom:6px">구절을 누르면 그 말씀으로 쓸 수 있어요</div>'+
        Object.keys(vs).map(Number).sort((a,b)=>a-b).map(n => '<button class="verse" data-v="'+n+'"><b>'+n+'</b><span>'+esc(vs[n])+'</span></button>').join('')+
        '<div class="row" style="gap:8px;margin-top:14px">'+
          '<button class="cta ghost small" id="pch"'+(i<=0?' disabled':'')+'>이전 장</button>'+
          '<button class="cta ghost small" id="nch"'+(i>=chapters.length-1?' disabled':'')+'>다음 장</button></div>';
      $$('.verse', pane).forEach(b => b.onclick = () => useVerse({ r: sh+' '+ch+':'+b.dataset.v, t: vs[b.dataset.v] }));
      $('#pch').onclick = () => view(book, chapters[i-1]);
      $('#nch').onclick = () => view(book, chapters[i+1]);
      store.set('gt_read', { b:book, c:ch });
    }
    $$('[data-up]', pane).forEach(u => u.onclick = () => u.dataset.up === '1' ? view(null) : view(book, null));
    pane.scrollTop = 0;
  };
  view(null);
}

/* ══ 대화 찾기 ══ */
function hitHTML(h, q){
  let t = esc(h.text);
  if(q){
    const i = h.text.toLowerCase().indexOf(q.toLowerCase());
    if(i > -1){
      const from = Math.max(0, i - 40);
      const cut = (from > 0 ? '…' : '') + h.text.slice(from);
      const j = cut.toLowerCase().indexOf(q.toLowerCase());
      t = esc(cut.slice(0, j)) + '<mark>' + esc(cut.slice(j, j + q.length)) + '</mark>' + esc(cut.slice(j + q.length));
    }
  }
  return '<button class="hit '+(h.who==='god'?'god':'me')+'" data-d="'+esc(h.date)+'" data-id="'+esc(h.id)+'">'+
    '<div class="d"><span>'+brief(h.date)+' · '+(h.who==='god'?'하나님':'나')+'</span>'+(h.rx?'<em class="e">'+esc(h.rx)+'</em>':'')+'</div>'+
    '<div class="t">'+t+'</div>'+(h.ref?'<div class="r">— '+esc(h.ref)+'</div>':'')+'</button>';
}
function bindHits(box, restore){
  $$('.hit', box).forEach(b => b.onclick = () => { forward(restore); showChat(b.dataset.d, b.dataset.id); });
}
function showSearch(fresh){
  if(fresh === true) S.search = { q:'', hits:[], cursor:null };
  const scr = mount('search');
  scr.innerHTML =
    '<div class="bar row" style="gap:4px"><button id="back" class="ib strong" aria-label="뒤로">'+ICON.left+'</button>'+
      '<div class="serif" style="font-size:17px">대화 찾기</div></div>'+
    '<form id="sf" class="sbar" style="margin-top:14px">'+ICON.search+
      '<input id="sq" placeholder="낱말이나 구절 주소(시 23)" enterkeyhint="search" autocomplete="off" maxlength="50" />'+
      '<button class="act" type="submit" style="flex:none">찾기</button></form>'+
    '<div id="sres" class="scroll grow" style="padding:0 16px calc(20px + env(safe-area-inset-bottom))"></div>';
  $('#back').onclick = goBack;
  const input = $('#sq'), box = $('#sres');
  let run = 0;
  const draw = (busy) => {
    const s = S.search;
    if(!s.q){ box.innerHTML = '<div class="note" style="text-align:center;margin-top:40px">지금까지 나눈 모든 대화에서 찾아요.</div>'; return; }
    box.innerHTML = s.hits.map(h => hitHTML(h, s.q)).join('') +
      (busy ? '<div class="note" style="text-align:center;padding:14px">'+(s.hits.length?'더 ':'')+'찾는 중…</div>'
        : s.cursor ? '<button class="cta ghost small" id="more" style="margin-top:6px">더 오래된 대화에서 찾기</button>'
        : '<div class="note" style="text-align:center;padding:14px">'+(s.hits.length ? '모두 '+s.hits.length+'개를 찾았어요' : '찾지 못했어요')+'</div>');
    bindHits(box, () => showSearch());
    if($('#more')) $('#more').onclick = () => more(4);
  };
  const more = async (rounds) => {
    const me = ++run, s = S.search;
    draw(true);
    for(let i=0; i<rounds; i++){
      const res = await api({ action:'search', q:s.q, cursor:s.cursor });
      if(me !== run || S.screen !== 'search') return;
      if(res.error){ if(res.error !== 'auth' && res.error !== 'locked'){ say(res.message || '찾지 못했어요'); draw(false); } return; }
      s.hits.push(...res.hits); s.cursor = res.cursor;
      if(!s.cursor) break;
      draw(true);
    }
    draw(false);
  };
  $('#sf').onsubmit = (e) => {
    e.preventDefault();
    const q = input.value.trim(); if(!q) return;
    input.blur();
    S.search = { q, hits:[], cursor:null };
    more(4);
  };
  input.value = S.search.q;
  draw(false);
  if(!S.search.q) input.focus();
}

/* ══ 마음에 남긴 말 (이모지를 남긴 말만) ══ */
async function loadReacts(onPart){
  const hits = [];
  let cursor = null;
  for(let i=0; i<60; i++){
    const res = await api({ action:'reacts', cursor });
    if(res.error) return { error:res.error, message:res.message, hits };
    hits.push(...res.hits); cursor = res.cursor;
    if(onPart) onPart(hits, !!cursor);
    if(!cursor) break;
  }
  return { hits };
}
async function showReacts(){
  const scr = mount('reacts');
  scr.innerHTML =
    '<div class="bar row" style="gap:4px"><button id="back" class="ib strong" aria-label="뒤로">'+ICON.left+'</button>'+
      '<div><div class="serif" style="font-size:17px">마음에 남긴 말</div><div style="font-size:11px;color:var(--sub)">이모지를 남긴 말만 모아 봐요</div></div></div>'+
    '<div class="pills" id="pills"></div>'+
    '<div id="fres" class="scroll grow" style="padding:10px 16px calc(20px + env(safe-area-inset-bottom))"><div class="note" style="text-align:center;margin-top:40px">여는 중…</div></div>';
  $('#back').onclick = goBack;
  const box = $('#fres');
  let all = [], more = true;
  const draw = () => {
    const count = (e) => all.filter(h => h.rx === e).length;
    if(S.rxFilter && !count(S.rxFilter)) S.rxFilter = '';
    $('#pills').innerHTML = '<button class="pill'+(S.rxFilter?'':' on')+'" data-e="">전체 '+all.length+'</button>'+
      RX.map(e => '<button class="pill'+(S.rxFilter===e?' on':'')+'" data-e="'+e+'"><em class="e">'+e+'</em>'+count(e)+'</button>').join('');
    $$('.pill').forEach(p => p.onclick = () => { S.rxFilter = p.dataset.e; draw(); });
    const list = S.rxFilter ? all.filter(h => h.rx === S.rxFilter) : all;
    if(!all.length && !more){
      box.innerHTML = '<div class="empty" style="height:70%"><div style="font-size:30px;font-family:var(--emoji);margin-bottom:14px">❤️ 🥹 🙏</div>'+
        '<div class="serif" style="font-size:16px;color:var(--soft);line-height:1.8">아직 남긴 이모지가 없어요.</div>'+
        '<div class="note" style="margin-top:8px">대화에서 마음에 남는 말풍선을 누르고<br/>이모지를 남겨 보세요.</div></div>';
      return;
    }
    box.innerHTML = list.map(h => hitHTML(h)).join('') + (more ? '<div class="note" style="text-align:center;padding:14px">더 여는 중…</div>' : '');
    bindHits(box, showReacts);
  };
  const res = await loadReacts((hits, hasMore) => { if(S.screen !== 'reacts') return; all = hits.slice(); more = hasMore; draw(); });
  if(S.screen !== 'reacts') return;
  more = false;
  if(res.error && res.error !== 'auth' && res.error !== 'locked' && !res.hits.length){
    box.innerHTML = '<div class="note" style="text-align:center;margin-top:40px">'+esc(res.message||'불러오지 못했어요')+'</div>'; return;
  }
  all = res.hits; draw();
}

/* 여러 날의 대화를 차례로 가져오기 (셋씩 나란히) */
async function fetchDays(dates, onStep){
  const out = new Array(dates.length);
  let next = 0, done = 0, failed = null;
  const worker = async () => {
    while(next < dates.length && !failed){
      const i = next++;
      const r = await api({ action:'day', date:dates[i] });
      if(r.error){ failed = r; return; }
      out[i] = { date:dates[i], messages:r.messages || [] };
      done++; if(onStep) onStep(done, dates.length);
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  if(failed) return { error:failed.error, message:failed.message };
  return { days: out.filter(d => d && d.messages.length) };
}
function saveFile(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 8000);
}

/* ══ PDF로 저장 ══
   대화창 모양 그대로 종이(A4)에 그려서 PDF 한 파일로 묶습니다.
   기기의 글꼴과 이모지로 그리기 때문에 이모지도 그대로 담깁니다. */
async function openPdf(){
  const today = keyOf(new Date());
  const box = el('<div class="bsheet" role="dialog" aria-modal="true"><div class="grab"></div>'+
    '<h3>PDF로 저장하기</h3><p>기간을 고르면 그동안의 대화 전체를 남긴 이모지와 함께 한 파일로 만들어요.</p>'+
    '<div class="pills" style="padding:14px 0 0" id="pq"><button class="pill" data-q="month">이번 달</button><button class="pill" data-q="3m">지난 3개월</button><button class="pill" data-q="year">올해</button><button class="pill" data-q="all">전체</button></div>'+
    '<div class="dates"><label class="dt"><small>시작</small><input type="date" id="pFrom" max="'+today+'" /></label><span class="dim">~</span>'+
      '<label class="dt"><small>끝</small><input type="date" id="pTo" max="'+today+'" /></label></div>'+
    '<div class="note" id="pInfo" style="margin-top:12px;min-height:22px">기록을 세는 중…</div>'+
    '<div class="bar2" id="pBar" style="display:none"><i></i></div>'+
    '<button class="cta" id="pGo" style="margin-top:14px" disabled>PDF 만들기</button></div>');
  const v = veil(box);
  const dates = (await loadDates(true)).slice().sort();
  if(!v.isConnected) return;
  const from = $('#pFrom'), to = $('#pTo'), go = $('#pGo'), info = $('#pInfo');
  const first = dates[0] || today;
  const inRange = () => dates.filter(d => d >= from.value && d <= to.value);
  const sync = () => {
    const ok = from.value && to.value && from.value <= to.value;
    const n = ok ? inRange().length : 0;
    info.textContent = !dates.length ? '아직 저장할 대화가 없어요' : !ok ? '시작과 끝 날짜를 확인해 주세요' : n ? '이 기간에 대화를 나눈 날이 '+n+'일 있어요' : '이 기간에는 대화가 없어요';
    go.disabled = !n; go.textContent = n ? 'PDF 만들기 · '+n+'일' : 'PDF 만들기';
  };
  const quick = (q) => {
    const now = new Date();
    const start = q === 'month' ? new Date(now.getFullYear(), now.getMonth(), 1)
      : q === '3m' ? new Date(now.getFullYear(), now.getMonth() - 2, 1)
      : q === 'year' ? new Date(now.getFullYear(), 0, 1) : toDate(first);
    from.value = keyOf(start); to.value = today;
    $$('#pq .pill').forEach(p => p.classList.toggle('on', p.dataset.q === q));
    sync();
  };
  $$('#pq .pill').forEach(p => p.onclick = () => quick(p.dataset.q));
  [from, to].forEach(i => i.addEventListener('change', () => { $$('#pq .pill').forEach(p => p.classList.remove('on')); sync(); }));
  quick('month');
  go.onclick = async () => {
    const list = inRange(); if(!list.length) return;
    const range = [from.value, to.value];
    go.disabled = true; $('#pBar').style.display = 'block';
    const step = (label, ratio) => { if(!v.isConnected) return; go.textContent = label; $('#pBar i').style.width = Math.round(ratio * 100) + '%'; };
    const stop = () => { if(v.isConnected){ sync(); $('#pBar').style.display = 'none'; } };
    const got = await fetchDays(list, (n, t) => step('대화 모으는 중… '+n+' / '+t, n / t * 0.5));
    if(!v.isConnected) return;
    if(got.error){ say(got.message || '모으다 멈췄어요'); stop(); return; }
    if(!got.days.length){ say('이 기간에는 대화가 없어요'); stop(); return; }
    try{
      const blob = await makePdf(got.days, { from:range[0], to:range[1], nick:S.me.nick }, (p) => step('PDF 만드는 중… '+p+'쪽', 0.5 + Math.min(0.48, p * 0.02)));
      saveFile(blob, 'GodTalk_'+range[0]+'_'+range[1]+'.pdf');
      v.remove(); say('PDF를 저장했어요');
    }catch(e){
      say('PDF를 만들지 못했어요. 기간을 줄여 다시 해보세요'); stop();
    }
  };
}

async function makePdf(days, meta, onPage){
  const PW = 595, PH = 842, K = 2;                 /* A4, 2배로 또렷하게 */
  const MX = 46, TOP = 54, BOTTOM = 56, MAXW = 330, PADX = 12, PADY = 8;
  const cs = getComputedStyle(document.documentElement);
  const SERIF = cs.getPropertyValue('--serif'), SANS = cs.getPropertyValue('--sans'), EMOJI = cs.getPropertyValue('--emoji');
  const C = { ink:'#2E261D', sub:'#8F7D68', line:'#D9C7A6', god:'#FFFDF8', mine:'#DCE6D4', mineInk:'#26301F', chip:'#F1ECE3', accent:'#9A6B2F' };
  /* 말씀에 쓰인 글자의 글꼴 조각을 미리 받아 둡니다 (안 그러면 일부 글자만 다른 글꼴로 그려집니다) */
  const godChars = Array.from(new Set(days.flatMap(d => d.messages.filter(m => m.who === 'god').map(m => m.text)).join(''))).join('') || '가';
  try{ await Promise.all([document.fonts.load('12px "Gowun Batang"', godChars), document.fonts.load('bold 12px "Gowun Batang"', '하나님과의 대화')]); }catch(e){}
  const face = await new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = AVATAR; });

  const cv = document.createElement('canvas'); cv.width = PW * K; cv.height = PH * K;
  const g = cv.getContext('2d');
  const pages = [];
  let y = 0, pageNo = 0;
  const font = (size, fam, weight) => { g.font = (weight ? weight + ' ' : '') + size + 'px ' + fam; };
  const begin = () => {
    pageNo++;
    g.setTransform(K, 0, 0, K, 0, 0);
    g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, PW, PH);
    g.textBaseline = 'alphabetic'; g.textAlign = 'left';
    y = TOP;
  };
  const finish = async () => {
    font(8.5, SANS); g.fillStyle = C.sub; g.textAlign = 'center';
    g.fillText('– ' + pageNo + ' –', PW / 2, PH - 28);
    g.textAlign = 'left';
    const blob = await new Promise((res) => cv.toBlob(res, 'image/jpeg', 0.84));
    pages.push(new Uint8Array(await blob.arrayBuffer()));
    if(onPage) onPage(pageNo);
    await new Promise((r) => setTimeout(r, 0));
  };
  const room = () => PH - BOTTOM - y;
  const newPage = async () => { await finish(); begin(); };
  /* 줄 나누기: 낱말 단위로, 너무 긴 낱말만 글자 단위로 */
  const wrap = (text, maxW) => {
    const out = [];
    for(const para of String(text).split('\n')){
      let line = '';
      for(const word of para.split(/(\s+)/)){
        if(!word) continue;
        if(g.measureText(line + word).width <= maxW){ line += word; continue; }
        if(line.trim()){ out.push(line.trimEnd()); line = ''; }
        if(/^\s+$/.test(word)) continue;
        if(g.measureText(word).width <= maxW){ line = word; continue; }
        for(const ch of Array.from(word)){
          if(g.measureText(line + ch).width > maxW && line){ out.push(line); line = ''; }
          line += ch;
        }
      }
      out.push(line.trimEnd());
    }
    return out;
  };
  const rrect = (x, yy, w, h, r) => { g.beginPath(); g.moveTo(x + r, yy); g.arcTo(x + w, yy, x + w, yy + h, r); g.arcTo(x + w, yy + h, x, yy + h, r); g.arcTo(x, yy + h, x, yy, r); g.arcTo(x, yy, x + w, yy, r); g.closePath(); };

  begin();
  /* 첫 장 머리글 */
  g.fillStyle = C.accent; font(8.5, SANS, 'bold'); g.fillText('D A W N   L E T T E R S', MX, y + 4);
  g.fillStyle = C.ink; font(24, SERIF, 'bold'); g.fillText('하나님과의 대화', MX, y + 36);
  g.fillStyle = C.sub; font(10.5, SANS);
  g.fillText(dotted(meta.from) + ' ~ ' + dotted(meta.to) + '  ·  ' + days.length + '일의 대화' + (meta.nick ? '  ·  ' + meta.nick : ''), MX, y + 56);
  if(face){ g.save(); rrect(PW - MX - 50, y - 6, 50, 50, 16); g.clip(); g.drawImage(face, PW - MX - 50, y - 6, 50, 50); g.restore(); }
  g.strokeStyle = C.line; g.lineWidth = 1; g.beginPath(); g.moveTo(MX, y + 70); g.lineTo(PW - MX, y + 70); g.stroke();
  y += 92;

  for(const day of days){
    if(room() < 90) await newPage();
    /* 날짜 */
    font(9.5, SANS, 'bold');
    const label = pretty(day.date), lw = g.measureText(label).width + 26;
    g.fillStyle = C.chip; rrect((PW - lw) / 2, y, lw, 20, 10); g.fill();
    g.fillStyle = C.sub; g.textAlign = 'center'; g.fillText(label, PW / 2, y + 13.5); g.textAlign = 'left';
    y += 32;

    let prev = null;
    for(const m of day.messages){
      const god = m.who === 'god';
      const size = god ? 11.5 : 11, lh = size * 1.6, fam = god ? SERIF : SANS;
      font(size, fam);
      const lines = wrap(m.text, MAXW - PADX * 2);
      let refLines = [];
      if(m.ref){ font(9, SANS); refLines = wrap('— ' + m.ref, MAXW - PADX * 2); }
      const rows = lines.map(t => ({ t, size, fam, lh, color: god ? C.ink : C.mineInk }))
        .concat(refLines.map(t => ({ t, size:9, fam:SANS, lh:15, color:C.accent })));
      let bw = 0;
      for(const r of rows){ font(r.size, r.fam); bw = Math.max(bw, g.measureText(r.t).width); }
      bw = Math.min(MAXW, Math.max(bw + PADX * 2, 34));

      if(god && prev !== 'god'){
        if(room() < 60) await newPage();
        font(9, SANS, 'bold'); g.fillStyle = C.accent; g.fillText('하나님', MX + 2, y + 8); y += 14;
      }else if(prev && prev !== m.who){ y += 4; }
      prev = m.who;

      let i = 0, last = null;
      while(i < rows.length){
        let fit = 0, h = PADY * 2;
        while(i + fit < rows.length && h + rows[i + fit].lh <= room()){ h += rows[i + fit].lh; fit++; }
        if(fit === 0){ await newPage(); continue; }
        const x = god ? MX : PW - MX - bw;
        g.fillStyle = god ? C.god : C.mine; rrect(x, y, bw, h, 12); g.fill();
        if(god){ g.strokeStyle = C.line; g.lineWidth = 0.8; rrect(x, y, bw, h, 12); g.stroke(); }
        let ty = y + PADY;
        for(let k = 0; k < fit; k++){
          const r = rows[i + k];
          font(r.size, r.fam); g.fillStyle = r.color;
          g.fillText(r.t, x + PADX, ty + r.lh * 0.72);
          ty += r.lh;
        }
        last = { x, y, w:bw, h };
        y += h; i += fit;
        if(i < rows.length) await newPage();
      }
      /* 시간과 이모지 */
      if(last){
        font(7.5, SANS); g.fillStyle = C.sub;
        if(m.time){
          if(god) g.fillText(m.time, last.x + last.w + 5, last.y + last.h - 3);
          else { g.textAlign = 'right'; g.fillText(m.time, last.x - 5, last.y + last.h - 3); g.textAlign = 'left'; }
        }
        if(m.rx){
          const ex = god ? last.x + 2 : last.x + last.w - 26;
          g.fillStyle = '#FFFFFF'; rrect(ex, y + 3, 24, 16, 8); g.fill();
          g.strokeStyle = C.line; g.lineWidth = 0.8; rrect(ex, y + 3, 24, 16, 8); g.stroke();
          font(10, EMOJI); g.textAlign = 'center'; g.fillStyle = C.ink;
          g.fillText(m.rx, ex + 12, y + 14.8); g.textAlign = 'left';
          y += 20;
        }
      }
      y += 6;
    }
    y += 14;
  }
  await finish();

  /* PDF 파일로 묶기 — 쪽마다 그림 한 장 */
  const enc = new TextEncoder();
  const parts = [], offsets = [];
  let size = 0;
  const put = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); size += b.length; };
  const obj = (n, body) => { offsets[n] = size; put(n + ' 0 obj\n' + body + '\nendobj\n'); };
  put('%PDF-1.4\n');
  put(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
  const total = 2 + pages.length * 3;
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Count ' + pages.length + ' /Kids [' + pages.map((_, i) => (3 + i * 3) + ' 0 R').join(' ') + '] >>');
  pages.forEach((jpg, i) => {
    const p = 3 + i * 3, c = p + 1, im = p + 2;
    const stream = 'q ' + PW + ' 0 0 ' + PH + ' 0 0 cm /Im0 Do Q';
    obj(p, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + PW + ' ' + PH + '] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + c + ' 0 R >>');
    obj(c, '<< /Length ' + stream.length + ' >>\nstream\n' + stream + '\nendstream');
    offsets[im] = size;
    put(im + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + (PW * K) + ' /Height ' + (PH * K) + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n');
    put(jpg); put('\nendstream\nendobj\n');
  });
  const xref = size;
  let table = 'xref\n0 ' + (total + 1) + '\n0000000000 65535 f \n';
  for(let n = 1; n <= total; n++) table += String(offsets[n]).padStart(10, '0') + ' 00000 n \n';
  put(table + 'trailer\n<< /Size ' + (total + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(parts, { type:'application/pdf' });
}

/* ══ 시작 ══ */
async function enter(){
  const code = (() => { try{ return sessionStorage.getItem('gt_claim'); }catch(e){ return null; } })();
  if(code){
    try{ sessionStorage.removeItem('gt_claim'); }catch(e){}
    const r = await api({ action:'claim', code });
    if(r.ok){ S.me = Object.assign(S.me, r.user); say('예전 기록을 이어받았어요'); }
    else if(r.message) say(r.message);
  }
  S.offline = false; S.days = {}; S.dates = null;
  store.set('gt_tag', S.me.tag); store.set('gt_pin', !!S.me.hasPin);
  home();
  flushOutbox();
}

async function boot(){
  const p = new URLSearchParams(location.search);
  const code = p.get('e'), claim = p.get('claim');
  if(claim){ try{ sessionStorage.setItem('gt_claim', claim); }catch(e){} }
  if(code || claim){ try{ history.replaceState(null, '', location.pathname); }catch(e){} }

  const res = await api({ action:'me' }, true);
  if(res.error === 'offline'){ S.offline = true; showOffline(); return; }
  S.ready = res.ready || { kakao:false, secret:false };
  S.me = res.user || null;
  if(!S.me){ showLogin(code); return; }
  if(S.me.locked){ showLock(); return; }
  await enter();
  if(code === 'pinreset') say('비밀번호를 풀었어요 · 설정에서 새로 걸 수 있어요');
}
boot();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
}
