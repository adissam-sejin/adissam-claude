<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>관리자 — 성림교회</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="page-admin">

<!-- 로그인 -->
<main class="login" id="login" hidden>
  <form class="login-card" id="login-form">
    <img src="assets/logo-mark.png" alt="" width="44" height="51">
    <h1>성림교회 관리자</h1>
    <label class="f"><span class="f-l">아이디</span><input id="login-id" type="text" autocomplete="username" autocapitalize="none" required></label>
    <label class="f"><span class="f-l">비밀번호</span><input id="login-pw" type="password" autocomplete="current-password" required></label>
    <p class="login-err" id="login-err" role="alert" hidden></p>
    <button class="a-btn a-primary" type="submit" id="login-btn">로그인</button>
  </form>
</main>

<!-- 관리 화면 -->
<div id="app" hidden>
  <header class="a-top">
    <div class="a-top-in">
      <b class="a-brand">성림교회 관리자</b>
      <div class="a-top-btns">
        <a class="a-btn a-small" href="index.html" target="_blank" rel="noopener">사이트 보기</a>
        <button class="a-btn a-small" type="button" id="logout" hidden>로그아웃</button>
      </div>
    </div>
    <div class="a-tabs" role="tablist">
      <button role="tab" type="button" data-tab="bulletin" aria-selected="true">주보</button>
      <button role="tab" type="button" data-tab="roster" aria-selected="false">대표기도·봉사 명단</button>
      <button role="tab" type="button" data-tab="birthday" aria-selected="false">생일 명단</button>
      <button role="tab" type="button" data-tab="info" aria-selected="false">교회 정보</button>
      <button role="tab" type="button" data-tab="menu" aria-selected="false">상단 메뉴</button>
    </div>
  </header>

  <p class="a-banner" id="demo-banner" hidden>미리보기 모드입니다. 저장한 내용은 <b>이 브라우저에만</b> 남고 다른 사람에게는 보이지 않습니다. <button type="button" class="a-link" id="demo-reset">처음 상태로 되돌리기</button></p>

  <main class="a-main">
    <section id="tab-bulletin" class="a-tab"></section>
    <section id="tab-roster" class="a-tab" hidden></section>
    <section id="tab-birthday" class="a-tab" hidden></section>
    <section id="tab-info" class="a-tab" hidden></section>
    <section id="tab-menu" class="a-tab" hidden></section>
  </main>
</div>

<div class="a-toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/config.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/common.js"></script>
<script src="js/bulletin-view.js"></script>
<script src="js/import.js"></script>
<script src="js/birthdays.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
