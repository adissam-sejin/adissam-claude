<body class="page-bulletin">
<header class="site-nav" id="site-nav"></header>

<main>
  <!-- 비밀번호 입력 -->
  <section class="lock" id="lock" hidden>
    <h1>헌금명단</h1>
    <p>교인만 볼 수 있습니다. 비밀번호를 입력해 주세요.</p>
    <form id="lock-form">
      <input id="lock-pw" type="password" inputmode="numeric" autocomplete="off" aria-label="비밀번호" required>
      <button type="submit" id="lock-btn">확인</button>
    </form>
    <p class="lock-err" id="lock-err" role="alert" hidden></p>
  </section>

  <!-- 명단 -->
  <div id="unlocked" hidden>
    <div class="b-sizebar" id="sizebar" role="group" aria-label="글자 크기">
      <span>글자 크기</span>
      <button type="button" data-size="0" aria-label="보통">가</button>
      <button type="button" data-size="1" aria-label="크게">가</button>
      <button type="button" data-size="2" aria-label="아주 크게">가</button>
    </div>
    <div id="offering" class="bulletin"></div>
    <div class="b-archive" id="archive">
      <label for="archive-select">지난 명단</label>
      <select id="archive-select"></select>
      <button type="button" class="btn btn-line b-pdf" id="lock-again">잠그기</button>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/common.js"></script>

<script src="js/install.js"></script>
</body>
</html>
