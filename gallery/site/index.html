<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#16141a">
  <title>온라인 3D 전시관</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- 입장 화면 -->
  <main id="entry" class="screen">
    <form id="entryForm" class="card">
      <p class="eyebrow">ONLINE 3D GALLERY</p>
      <h1>온라인 전시관</h1>
      <p class="sub">입장권 코드를 입력하고 전시를 관람하세요.<br>수강생은 수강생 코드로 입장하면 작품을 올릴 수 있습니다.</p>

      <label for="code">입장 코드</label>
      <input id="code" class="code-input" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="예: AB12CD" required>

      <label for="name">이름</label>
      <input id="name" maxlength="12" autocomplete="nickname" placeholder="전시관에 표시될 이름" required>

      <label>캐릭터 선택</label>
      <div id="avatars" class="avatars" role="radiogroup" aria-label="캐릭터 선택"></div>

      <p id="entryError" class="error" role="alert" hidden></p>
      <button id="enterBtn" class="btn primary" type="submit">입장하기</button>
    </form>
  </main>

  <!-- 전시관 HUD -->
  <div id="hud" hidden>
    <header class="topbar">
      <div class="title-wrap">
        <strong id="exName"></strong>
        <span id="online" class="pill">관람객 1명</span>
      </div>
      <div class="actions">
        <button id="uploadBtn" class="btn small primary" hidden>작품 올리기</button>
        <button id="exitBtn" class="btn small">나가기</button>
      </div>
    </header>
    <p id="hint" class="hint"></p>
    <div id="joystick" class="joystick" aria-hidden="true"><div class="knob"></div></div>
    <div id="toast" class="toast" hidden></div>
  </div>

  <!-- 작품 크게 보기 -->
  <div id="viewer" class="modal" hidden>
    <button class="close" data-close aria-label="닫기">✕</button>
    <div class="viewer-body">
      <img id="viewerImg" alt="">
      <div class="viewer-info">
        <div>
          <strong id="viewerTitle"></strong>
          <span id="viewerAuthor"></span>
        </div>
        <div class="viewer-actions">
          <button id="deleteBtn" class="btn small danger" hidden>삭제</button>
          <button id="heartBtn" class="heart-btn" aria-pressed="false">
            <span class="heart">♥</span><span id="heartCount">0</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 작품 올리기 -->
  <div id="uploader" class="modal" hidden>
    <form id="uploadForm" class="card">
      <button type="button" class="close" data-close aria-label="닫기">✕</button>
      <h2>작품 올리기</h2>
      <p id="quota" class="sub"></p>
      <label class="file-drop" for="file">
        <img id="preview" alt="" hidden>
        <span id="fileHint">이미지를 선택하세요 (JPG, PNG, WEBP)</span>
      </label>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      <label for="artTitle">작품 제목</label>
      <input id="artTitle" maxlength="40" placeholder="예: 봄날의 고양이">
      <label for="artAuthor">작가 이름</label>
      <input id="artAuthor" maxlength="20" placeholder="작품 아래에 표시될 이름">
      <p id="uploadError" class="error" role="alert" hidden></p>
      <button id="submitArt" class="btn primary" type="submit">전시하기</button>
    </form>
  </div>

  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
